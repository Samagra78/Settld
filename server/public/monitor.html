<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Backend Monitor</title>
  <style>
    :root { color-scheme: dark; --bg:#0f1012; --card:#191b1f; --line:#2a2d33; --text:#e8e8ea; --muted:#9a9ca3; --ok:#3ecf8e; --bad:#ff6b6b; --warn:#f0b429; --accent:#5b8cff; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
    main { max-width:1200px; margin:0 auto; padding:20px 16px 48px; }
    h1 { font-size:20px; margin:0; } h2 { font-size:15px; margin:0 0 10px; color:var(--muted); font-weight:600; letter-spacing:.02em; }
    header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    .muted { color:var(--muted); } .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap:12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; overflow:hidden; }
    .stats { display:flex; gap:10px; flex-wrap:wrap; }
    .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; min-width:120px; }
    .stat b { display:block; font-size:20px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    td, th { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:500; }
    code { font:12px ui-monospace, monospace; }
    a { color:var(--accent); text-decoration:none; }
    .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
    .scroll { max-height:420px; overflow:auto; }
    .flow { display:flex; gap:6px; flex-wrap:wrap; font-size:12px; }
    .flow span { padding:2px 8px; border-radius:6px; background:#22252b; color:var(--muted); }
    .flow span.on { background:#1d3b2e; color:var(--ok); }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Settld backend monitor</h1>
      <div class="muted">Live view of the watcher, Chainlink workflows, keeper and contract events · refreshes every 4 s</div>
    </div>
    <div class="muted" id="updated">loading…</div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="grid" style="margin-top:12px">
    <section class="card">
      <h2>Automation (watcher → Chainlink workflows, keeper)</h2>
      <div id="auto"></div>
      <div class="scroll"><table id="activity"></table></div>
    </section>
    <section class="card">
      <h2>Court cases</h2>
      <div class="scroll"><table id="cases"></table></div>
    </section>
    <section class="card">
      <h2>Deals</h2>
      <div class="scroll"><table id="deals"></table></div>
    </section>
    <section class="card">
      <h2>Contract events (archived in the database)</h2>
      <div class="scroll"><table id="events"></table></div>
    </section>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const short = (a) => (a ? esc(String(a).slice(0, 6) + "…" + String(a).slice(-4)) : "–");
  const ago = (iso) => { const s = Math.round((Date.now() - new Date(iso.endsWith("Z") ? iso : iso + "Z").getTime()) / 1000); return s < 60 ? s + "s ago" : Math.round(s / 60) + "m ago"; };
  const BAND = (b) => (b === null || b === undefined ? "–" : b === 255 ? "no decision" : b + "%");
  let explorer = "";
  const tx = (h) => `<a href="${explorer}/tx/${esc(h)}" target="_blank" rel="noopener">${short(h)}</a>`;

  async function tick() {
    try {
      const [m, a] = await Promise.all([fetch("/api/monitor").then((r) => r.json()), fetch("/api/automation/status").then((r) => r.json())]);
      explorer = m.explorer;
      const s = m.stats;
      $("stats").innerHTML = [
        ["Deals", m.deals.length], ["Cases", m.cases.length], ["Decided", s.casesDecided], ["By humans", s.decidedByHumans],
        ["Verified humans", s.verifiedHumans], ["Arbitrators", s.arbitrators], ["Open panels", s.openPanels],
      ].map(([k, v]) => `<div class="stat"><span class="muted">${k}</span><b>${v}</b></div>`).join("");

      $("auto").innerHTML = `<p class="muted" style="margin:0 0 8px">${a.enabled ? '<span class="ok">● on</span>' : '<span class="bad">● off</span>'}
        · running: <b>${esc(a.running) || "–"}</b> · queued: ${esc(a.queued.join(", ")) || "–"} · last block ${esc(a.lastBlock) || "–"}</p>`;
      $("activity").innerHTML = "<tr><th>When</th><th></th><th>What</th><th>Detail</th></tr>" + a.recent.map((e) =>
        `<tr><td class="muted">${ago(e.at)}</td><td class="${e.ok ? "ok" : "bad"}">${e.ok ? "✓" : "✗"}</td>
         <td>${e.kind === "workflow" ? "🔗 " : "🧹 "}${esc(e.label)}</td>
         <td><code>${/^0x[0-9a-f]{64}$/i.test(e.detail) ? tx(e.detail) : esc(e.detail.slice(0, 140))}</code></td></tr>`).join("");

      const stage = (c) => {
        const steps = [["AI debate", c.rounds > 0], ["AI verdict", c.ai_band !== null], ["Appealed", !!c.appealed], ["Arbitrators", c.panel_band !== null], ["Final", c.status === "final"]];
        return `<div class="flow">${steps.map(([n, on]) => `<span class="${on ? "on" : ""}">${n}</span>`).join("")}</div>`;
      };
      $("cases").innerHTML = "<tr><th>Case</th><th>Deal · clause</th><th>Progress</th><th>Bands</th></tr>" + m.cases.map((c) =>
        `<tr><td><b>#${c.case_id}</b><div class="muted">${esc(c.reason || "").slice(0, 60)}</div></td>
         <td>${c.deal_id} · ${c.clause_id}</td>
         <td>${stage(c)}<div class="muted">rounds ${c.rounds}${c.extensions ? " · +" + c.extensions + " ext" : ""}</div></td>
         <td>AI ${BAND(c.ai_band)}<br>humans ${BAND(c.panel_band)}<br><b>final ${BAND(c.final_band)}</b></td></tr>`).join("") ||
        "<tr><td class='muted'>No cases yet.</td></tr>";

      $("deals").innerHTML = "<tr><th>Deal</th><th>Client</th><th>Freelancer</th><th>Status</th></tr>" + m.deals.map((d) =>
        `<tr><td><b>#${d.deal_id}</b></td><td><code>${short(d.client)}</code></td><td><code>${short(d.freelancer)}</code></td>
         <td><div class="flow"><span class="${d.accepted ? "on" : ""}">accepted</span><span class="${d.certified ? "on" : ""}">certified</span><span class="${d.funded ? "on" : ""}">funded</span></div></td></tr>`).join("") ||
        "<tr><td class='muted'>No deals yet.</td></tr>";

      $("events").innerHTML = "<tr><th>Block</th><th>Event</th><th>Args</th><th>Tx</th></tr>" + m.events.map((e) => {
        const args = JSON.parse(e.args_json);
        const txt = Object.entries(args).map(([k, v]) => `${k}=${String(v).length > 14 ? short(v) : esc(v)}`).join(" ");
        return `<tr><td class="muted">${e.block}</td><td><span class="pill">${esc(e.name)}</span></td><td><code>${txt}</code></td><td>${tx(e.tx_hash)}</td></tr>`;
      }).join("") || "<tr><td class='muted'>No events yet.</td></tr>";

      $("updated").textContent = "updated " + new Date().toLocaleTimeString();
    } catch (e) {
      $("updated").innerHTML = '<span class="bad">server unreachable</span>';
    }
  }
  tick();
  setInterval(tick, 4000);
</script>
</body>
</html>
