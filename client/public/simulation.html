<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settld Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Jersey+10&display=swap">
<style>
  :root{--ink:#1A1A1A;--blue:#2038E2;--ciel:#007BFF;--orange:#FF5A00;--beige:#FFE6D0;--white:#FFFFFF}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0f0f0f;color:var(--white);font-family:'Inter Tight',system-ui,sans-serif}
  .stage{position:fixed;inset:0 0 64px 0;display:flex;align-items:center;justify-content:center}
  #out{width:100%;height:100%;object-fit:contain;background:#0f0f0f;display:block}
  .ctl{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;gap:12px;align-items:center;padding:0 16px;background:var(--ink);border-top:1px solid rgba(255,230,208,.18)}
  .ctl button{height:40px;padding:0 14px;border-radius:6px;border:1px solid rgba(255,230,208,.4);background:none;color:var(--white);font:inherit;cursor:pointer}
  .ctl button.rec{background:var(--orange);border-color:var(--orange);color:var(--ink)}
  .ctl input[type=range]{flex:1;accent-color:var(--orange)}
  .ctl .t{font-family:'Jersey 10',monospace;font-size:24px;min-width:110px;text-align:right}
  .ctl .msg{font-size:13px;color:rgba(255,230,208,.72)}
</style>
</head>
<body>
<div class="stage"><canvas id="out" width="1920" height="1080"></canvas></div>
<div class="ctl">
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span class="t" id="time">0.0 s</span>
  <button id="rec" class="rec">Record 1080p video</button>
  <span class="msg" id="msg">Space: play / pause · ← →: step 1 s</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(async function () {
'use strict';
const W = 1920, H = 1080, END = 54.5;
const C = { ink: 0x1A1A1A, blue: 0x2038E2, ciel: 0x007BFF, orange: 0xFF5A00, beige: 0xFFE6D0, white: 0xFFFFFF, red: 0xE5251B, grey: 0x555555 };
try { await Promise.all([document.fonts.load('64px "Jersey 10"'), document.fonts.load('500 40px "Inter Tight"'), document.fonts.load('600 40px "Inter Tight"')]); } catch (e) {}

// ---------- helpers ----------
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const cl = (x) => Math.max(0, Math.min(1, x));
const ss = (a, b, t) => { const x = cl((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const win = (t, a, b, f = 0.35) => Math.min(ss(a, a + f, t), 1 - ss(b - f, b, t)); // fade in at a, out at b
const lerp = (a, b, k) => a + (b - a) * k;
const lv = (a, b, k) => new THREE.Vector3().lerpVectors(a, b, k);
const arc = (a, b, k, h) => { const p = lv(a, b, k); p.y += Math.sin(Math.PI * k) * h; return p; };
const UP = V(0, 1, 0);

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(C.ink);
scene.fog = new THREE.Fog(C.ink, 26, 62);
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2a2a, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(6, 14, 10); scene.add(sun);
const rim = new THREE.DirectionalLight(0x6f86ff, 0.45); rim.position.set(-10, 6, -12); scene.add(rim);

const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.55, metalness: 0.08, transparent: true }, o));
function mesh(geo, m, p) { const x = new THREE.Mesh(geo, m); if (p) x.position.copy(p); scene.add(x); return x; }
function setOp(obj, a) {
  obj.visible = a > 0.004;
  obj.traverse((o) => { const ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : []; for (const m of ms) { if (m.userData.base === undefined) m.userData.base = m.opacity; m.opacity = a * m.userData.base; } });
}
function setBeam(m, a, b) {
  const d = new THREE.Vector3().subVectors(b, a); const L = Math.max(d.length(), 0.0001);
  m.position.copy(a).addScaledVector(d, 0.5); m.scale.set(1, L, 1); m.quaternion.setFromUnitVectors(UP, d.normalize());
}
function beam(color, r = 0.05) { const m = mesh(new THREE.CylinderGeometry(r, r, 1, 10, 1, true), new THREE.MeshBasicMaterial({ color, transparent: true, depthWrite: false })); m.visible = false; return m; }

function makeLabel(text, o = {}) {
  const px = o.px || 64, bit = o.font !== 'sans';
  const f = bit ? `${px}px "Jersey 10"` : `500 ${px}px "Inter Tight"`;
  const c = document.createElement('canvas'); const ctx = c.getContext('2d'); ctx.font = f;
  const w = Math.ceil(ctx.measureText(text).width + px * 0.9), h = Math.ceil(px * 1.3);
  c.width = w; c.height = h; ctx.font = f;
  if (o.bg !== null) { ctx.fillStyle = o.bg || '#1A1A1A'; ctx.beginPath(); ctx.roundRect(0, 0, w, h, px * 0.16); ctx.fill(); }
  if (o.border) { ctx.strokeStyle = o.border; ctx.lineWidth = px * 0.08; ctx.beginPath(); ctx.roundRect(px * 0.04, px * 0.04, w - px * 0.08, h - px * 0.08, px * 0.14); ctx.stroke(); }
  ctx.fillStyle = o.fg || '#FFFFFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(bit ? text.toUpperCase() : text, w / 2, h / 2 + px * 0.05);
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
  const sh = o.h || 0.5; s.scale.set(sh * w / h, sh, 1); s.renderOrder = 20; s.visible = false; scene.add(s); return s;
}
function lab(s, p, a) { s.position.copy(p); s.material.opacity = a; s.visible = a > 0.004; }

// ---------- world ----------
const floor = mesh(new THREE.PlaneGeometry(200, 200), mat(0x151515, { transparent: false, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2;
const grid = new THREE.GridHelper(120, 120, C.beige, C.beige); grid.material.transparent = true; grid.material.opacity = 0.05; grid.position.y = 0.01; scene.add(grid);

// Arc vault
const vault = new THREE.Group(); scene.add(vault);
const vBase = new THREE.Mesh(new THREE.BoxGeometry(7.8, 0.6, 3), mat(0x232323, { transparent: false })); vBase.position.y = 0.3; vault.add(vBase);
const vEdge = new THREE.Mesh(new THREE.BoxGeometry(7.9, 0.06, 3.1), new THREE.MeshBasicMaterial({ color: C.ciel })); vEdge.position.y = 0.62; vault.add(vEdge);
const vaultLabel = makeLabel('Arc · ClauseEscrow', { px: 56, h: 0.42, fg: '#FFE6D0', bg: '#1A1A1A', border: '#007BFF' });
const SLOT_X = [-2.7, -0.9, 0.9, 2.7];
const slotPos = (i) => V(SLOT_X[i], 0.88, 0);
const slotLabels = SLOT_X.map((x, i) => makeLabel('0' + (i + 1), { px: 48, h: 0.34, bg: null, fg: '#FFE6D0' }));

// people
function person(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.9, 6, 16), mat(color)); body.position.y = 0.9; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.36, 24, 16), mat(color)); head.position.y = 2.05; g.add(head);
  scene.add(g); return g;
}
const CLIENT_P = V(-8, 0, 1.6), FREE_P = V(8, 0, 1.6);
const client = person(C.beige); client.position.copy(CLIENT_P);
const free = person(C.orange); free.position.copy(FREE_P);
const clientLabel = makeLabel('Client', { px: 52, h: 0.42 });
const freeLabel = makeLabel('Freelancer', { px: 52, h: 0.42 });
const freeGain = makeLabel('+750 USDC', { px: 56, h: 0.46, bg: '#FF5A00', fg: '#1A1A1A' });
const freeGain2 = makeLabel('+80% of clause 01', { px: 52, h: 0.75, bg: '#FF5A00', fg: '#1A1A1A' });
const clientGain = makeLabel('20% back', { px: 52, h: 0.75, bg: '#FFE6D0', fg: '#1A1A1A' });

// contract document + two extraction models
const DOC = V(-5.2, 3.4, -0.6);
const doc = mesh(new THREE.BoxGeometry(2.6, 3.4, 0.06), mat(C.white, { roughness: 0.8 }), DOC);
const docLines = [];
for (let k = 0; k < 6; k++) {
  const l = mesh(new THREE.BoxGeometry(k === 5 ? 1.3 : 2.0, 0.13, 0.03), mat(C.ink), V(DOC.x - (k === 5 ? 0.35 : 0), DOC.y + 1.15 - k * 0.46, DOC.z + 0.05));
  docLines.push(l);
}
const docTitle = makeLabel('Plain-English contract', { px: 44, h: 0.34, font: 'sans', bg: '#1A1A1A', fg: '#FFE6D0' });
const scan = mesh(new THREE.BoxGeometry(2.7, 0.05, 0.12), new THREE.MeshBasicMaterial({ color: C.ciel, transparent: true }));
const exA = mesh(new THREE.SphereGeometry(0.3, 24, 16), mat(C.ciel, { emissive: C.ciel, emissiveIntensity: 0.6 }));
const exB = mesh(new THREE.SphereGeometry(0.3, 24, 16), mat(C.beige, { emissive: C.beige, emissiveIntensity: 0.4 }));
const exALabel = makeLabel('Gemini', { px: 40, h: 0.3, bg: null, fg: '#007BFF' });
const exBLabel = makeLabel('gpt-oss', { px: 40, h: 0.3, bg: null, fg: '#FFE6D0' });
const vagueLabel = makeLabel('Vague · flagged', { px: 40, h: 0.32, bg: '#FF5A00', fg: '#1A1A1A' });
const skipLabel = makeLabel('Not a task · skipped', { px: 40, h: 0.32, bg: '#333333', fg: '#FFE6D0' });
const amountLabel = makeLabel('People set the amounts', { px: 44, h: 0.36, font: 'sans', bg: '#2038E2', fg: '#FFFFFF' });

// clause blocks
const CL_COL = { pending: new THREE.Color(C.white), verified: new THREE.Color(C.blue), paid: new THREE.Color(0x2e2e2e), frozen: new THREE.Color(C.orange) };
const blocks = [0, 1, 2, 3].map(() => mesh(new THREE.BoxGeometry(1.25, 0.5, 1.25), mat(C.white)));
const blockTag = [0, 1, 2, 3].map(() => makeLabel('Paid', { px: 40, h: 0.3, bg: '#1A1A1A', fg: '#FFE6D0', border: '#FFE6D0' }));
const frozenTag = makeLabel('Disputed · frozen', { px: 44, h: 0.36, bg: '#FF5A00', fg: '#1A1A1A' });
const settledTag = makeLabel('Settled', { px: 44, h: 0.6, bg: '#1A1A1A', fg: '#FFE6D0', border: '#FFE6D0' });

// coins: 5 per clause
const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.11, 40);
function coinMesh(side, face) { return mesh(coinGeo, [mat(side, { metalness: 0.3 }), mat(face, { metalness: 0.3 }), mat(face, { metalness: 0.3 })]); }
const coins = []; for (let i = 0; i < 4; i++) for (let j = 0; j < 5; j++) coins.push({ i, j, m: coinMesh(C.blue, C.ciel) });
const usdcLabel = makeLabel('USDC locked', { px: 48, h: 0.38, bg: '#007BFF', fg: '#1A1A1A' });

// Chainlink nodes
const NODE_C = V(0, 4.8, 0);
const nodes = [0, 1, 2, 3].map((i) => {
  const a = Math.PI / 4 + i * Math.PI / 2; const p = V(Math.cos(a) * 4.3, 4.8, Math.sin(a) * 2.6);
  const g = new THREE.Group(); g.position.copy(p); scene.add(g);
  const hex = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.32, 6), mat(C.blue, { emissive: C.blue, emissiveIntensity: 0.35 })); g.add(hex);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.035, 8, 6), new THREE.MeshBasicMaterial({ color: C.ciel, transparent: true })); ring.rotation.x = Math.PI / 2; g.add(ring);
  const cells = []; for (let k = 0; k < 16; k++) { const c = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.13, 0.13), mat(0x333333)); c.position.set(-0.27 + (k % 4) * 0.18, 0.55 + Math.floor(k / 4) * 0.18, 0); g.add(c); cells.push(c); }
  const llms = [C.beige, C.ciel, C.orange].map((col) => { const o = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 12), mat(col, { emissive: col, emissiveIntensity: 0.6 })); g.add(o); return o; });
  return { g, p, hex, ring, cells, llms, down: beam(C.ciel, 0.04), check: makeLabel('✓', { px: 56, h: 0.4, bg: '#007BFF', fg: '#1A1A1A', font: 'sans' }), toCourt: beam(C.ciel, 0.03) };
});
const donLabel = makeLabel('Chainlink nodes', { px: 52, h: 0.4, bg: '#2038E2', fg: '#FFFFFF' });
const llmNodeLabel = makeLabel('3 AI models on every node', { px: 48, h: 0.38, bg: '#2038E2', fg: '#FFFFFF' });
const cert = mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.12, 48), mat(C.ciel, { emissive: C.ciel, emissiveIntensity: 0.4 }));
cert.rotation.x = Math.PI / 2;
const certLabel = makeLabel('No deadlock · certified', { px: 52, h: 0.42, bg: '#007BFF', fg: '#1A1A1A' });
const packets = [1, 2, 3].map(() => mesh(new THREE.BoxGeometry(0.32, 0.32, 0.32), mat(C.ciel, { emissive: C.ciel, emissiveIntensity: 0.5 })));
const evLabel = makeLabel('Links submitted', { px: 44, h: 0.34, bg: '#1A1A1A', fg: '#FFE6D0', border: '#007BFF' });
const verifyBeams = [1, 2, 3].map(() => nodes.map(() => beam(C.ciel, 0.03)));

// Chainlink CRE emblem: a turning hexagon ring at the centre of the node ring
const cre = new THREE.Group(); scene.add(cre);
const creOuter = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.09, 8, 6), mat(C.blue, { emissive: C.blue, emissiveIntensity: 0.5 })); cre.add(creOuter);
const creInner = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.07, 8, 6), mat(C.ciel, { emissive: C.ciel, emissiveIntensity: 0.6 })); cre.add(creInner);
const creLabel = makeLabel('Chainlink CRE', { px: 48, h: 0.4, bg: '#2038E2', fg: '#FFFFFF' });

// Arc Studio workbench: a tilted screen with code, feeding the vault
const STUDIO = V(4.9, 0, -2.2);
const studio = new THREE.Group(); studio.position.copy(STUDIO); studio.rotation.y = -0.45; scene.add(studio);
const stLeg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.0, 0.12), mat(0x2e2e2e)); stLeg.position.y = 0.5; studio.add(stLeg);
const stFoot = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.06, 0.5), mat(0x2e2e2e)); stFoot.position.y = 0.03; studio.add(stFoot);
const stScreen = new THREE.Group(); stScreen.position.y = 1.55; stScreen.rotation.x = -0.18; studio.add(stScreen);
const stFrame = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.2, 0.07), mat(C.ciel, { emissive: C.ciel, emissiveIntensity: 0.25 })); stScreen.add(stFrame);
const stGlass = new THREE.Mesh(new THREE.BoxGeometry(1.76, 1.06, 0.02), mat(0x111111)); stGlass.position.z = 0.04; stScreen.add(stGlass);
const CODE = [[0.9, C.orange, 0], [1.2, C.ciel, 0.12], [0.7, C.beige, 0.12], [1.0, C.ciel, 0.24], [0.5, C.beige, 0.12], [0.8, C.orange, 0]];
const stCode = CODE.map(([w, col, ind], k) => { const l = new THREE.Mesh(new THREE.BoxGeometry(w, 0.07, 0.01), new THREE.MeshBasicMaterial({ color: col, transparent: true })); l.position.set(-0.72 + ind + w / 2, 0.38 - k * 0.15, 0.06); stScreen.add(l); return l; });
const studioLabel = makeLabel('Built in Arc Studio', { px: 44, h: 0.36, bg: '#1A1A1A', fg: '#007BFF', border: '#007BFF' });
const deployBits = [0, 1, 2, 3, 4, 5].map(() => mesh(new THREE.BoxGeometry(0.14, 0.14, 0.14), mat(C.ciel, { emissive: C.ciel, emissiveIntensity: 0.7 })));

// court
const COURT = V(0, 0, -11);
const COURT_BLOCK = V(0, 1.0, -11);
const PED = [V(-3.2, 0, -10.2), V(0, 0, -13.6), V(3.2, 0, -10.2)];
const peds = PED.map((p) => { const m = mesh(new THREE.CylinderGeometry(0.75, 0.9, 1.2, 32), mat(0x2a2a2a)); m.position.set(p.x, 0.6, p.z); return m; });
const courtFloor = mesh(new THREE.CylinderGeometry(5.4, 5.4, 0.08, 64), mat(0x1f1f1f)); courtFloor.position.set(COURT.x, 0.04, COURT.z - 1);
const courtRing = mesh(new THREE.TorusGeometry(5.4, 0.04, 8, 96), new THREE.MeshBasicMaterial({ color: C.orange, transparent: true })); courtRing.rotation.x = Math.PI / 2; courtRing.position.set(COURT.x, 0.1, COURT.z - 1);
const courtLabel = makeLabel('AI court', { px: 56, h: 0.44, bg: '#FF5A00', fg: '#1A1A1A' });
const JCOL = [C.beige, C.ciel, C.orange];
const judges = PED.map((p, i) => mesh(new THREE.SphereGeometry(0.55, 32, 20), mat(JCOL[i], { emissive: JCOL[i], emissiveIntensity: 0.45 }), V(p.x, 1.9, p.z)));
const judgeNames = ['gpt-oss', 'Gemini', 'Nemotron'].map((n, i) => makeLabel(n, { px: 44, h: 0.34, bg: '#1A1A1A', fg: ['#FFE6D0', '#007BFF', '#FF5A00'][i] }));
const talk = PED.map(() => { const r = mesh(new THREE.TorusGeometry(0.7, 0.04, 8, 48), new THREE.MeshBasicMaterial({ color: C.white, transparent: true })); r.visible = false; return r; });
const EV = [V(-1.1, 0.3, -8.9), V(0.3, 0.3, -8.9), V(1.9, 0.3, -8.6)];
const evTiles = EV.map((p, i) => { const m = mesh(new THREE.BoxGeometry(0.75, 0.06, 0.55), mat(i === 2 ? C.red : C.white)); m.position.copy(p); return m; });
const evNames = ['#1', '#2', '#7'].map((n, i) => makeLabel(n, { px: 44, h: 0.32, bg: i === 2 ? '#E5251B' : '#FFFFFF', fg: i === 2 ? '#FFFFFF' : '#1A1A1A' }));
const citeBeams = [[0, 1], [1, 0], [1, 1], [2, 2]].map(([j, e]) => ({ j, e, b: beam(j === 2 ? C.red : C.ciel, 0.035) }));
const fakeLabel = makeLabel('#7 never filed · rejected on-chain', { px: 44, h: 0.36, bg: '#E5251B', fg: '#FFFFFF' });
const verdictLabel = makeLabel('AI verdict · 80% to freelancer', { px: 52, h: 0.42, bg: '#FFE6D0', fg: '#1A1A1A' });

// appeal + arbitrators
const appealCoin = coinMesh(C.orange, C.orange);
const appealLabel = makeLabel('Appeal · 10% fee', { px: 48, h: 0.55, bg: '#FF5A00', fg: '#1A1A1A' });
const ORB = V(6.2, 0, -8.2);
const orb = new THREE.Group(); orb.position.copy(ORB); scene.add(orb);
const orbBall = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 20), mat(0x0d0d0d, { metalness: 0.6, roughness: 0.25 })); orbBall.position.set(1.4, 2.4, -0.4); orb.add(orbBall);
const orbIris = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.06, 12, 48), new THREE.MeshBasicMaterial({ color: C.white, transparent: true })); orbIris.position.set(1.4, 2.4, -0.4); orbIris.rotation.y = -Math.PI / 2.6; orb.add(orbIris);
const scanRing = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.035, 8, 48), new THREE.MeshBasicMaterial({ color: C.white, transparent: true })); scanRing.rotation.x = Math.PI / 2; orb.add(scanRing);
const orbLabel = makeLabel('World ID', { px: 52, h: 0.55, bg: '#FFFFFF', fg: '#1A1A1A' });
const barrier = mesh(new THREE.PlaneGeometry(2.2, 3.0), new THREE.MeshBasicMaterial({ color: C.red, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
barrier.rotation.y = Math.PI / 2;
const blockedLabel = makeLabel('Party · blocked', { px: 48, h: 0.6, bg: '#E5251B', fg: '#FFFFFF' });
const ARB_START = [V(13, 0, -5.5), V(14.2, 0, -6.5), V(15.4, 0, -7.5)];
const arbs = [0, 1, 2].map(() => person(C.ciel));
const arbRings = [0, 1, 2].map(() => { const r = mesh(new THREE.TorusGeometry(0.3, 0.045, 10, 36), new THREE.MeshBasicMaterial({ color: C.white, transparent: true })); return r; });
const humanTags = [0, 1, 2].map(() => makeLabel('✓ human', { px: 40, h: 0.45, bg: '#FFFFFF', fg: '#1A1A1A', font: 'sans' }));
const party = person(C.beige);
const partyLabel = makeLabel('Client, 2nd wallet', { px: 40, h: 0.5, bg: '#1A1A1A', fg: '#FFE6D0' });
const voteBox = [0, 1, 2].map(() => mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), mat(0x2a2a2a, { emissive: 0x111111 })));
const voteQ = [0, 1, 2].map(() => makeLabel('?', { px: 56, h: 0.6, bg: null, fg: '#FFE6D0' }));
const VOTES = ['80', '80', '50'];
const voteLabels = VOTES.map((v) => makeLabel(v, { px: 64, h: 0.75, bg: '#FFE6D0', fg: '#1A1A1A' }));
const finalLabel = makeLabel('Final · 80% · by humans', { px: 52, h: 0.6, bg: '#FFFFFF', fg: '#1A1A1A' });
const halves = [0, 1].map(() => coinMesh(C.orange, C.orange));
const feeTags = [0, 1].map(() => makeLabel('+ fee share', { px: 40, h: 0.5, bg: '#FF5A00', fg: '#1A1A1A' }));
const strikeTag = makeLabel('Strike 1 / 2', { px: 48, h: 0.6, bg: '#E5251B', fg: '#FFFFFF' });

// ---------- camera path ----------
const CAM = [
  [0, V(-3.5, 4.6, 12.5), V(-2.8, 2.1, 0)],
  [5.2, V(-1.5, 6, 14), V(-1, 1.6, 0)],

  // 07 incentives: fee to the majority, strike to the outlier
  halves.forEach((h, i) => {
    const k = ss(43.3, 44.5, t); const seat = V(PED[i].x, 1.2, PED[i].z);
    h.position.copy(arc(V(0, 2.3, -11), seat.clone().add(V(0, 2.1, 0)), k, 1.6)); h.scale.setScalar(0.72); h.rotation.z = tt * 2;
    setOp(h, ss(43.2, 43.4, t) * (1 - ss(44.4, 44.7, t)));
    lab(feeTags[i], seat.clone().add(V(0, 4.55, 0)), win(t, 44.4, 47.8));
  });
  lab(strikeTag, V(PED[2].x, 1.2 + 4.55, PED[2].z), win(t, 44.8, 47.8));

  // 08 settle
  lab(freeGain2, V(FREE_P.x, 4.0, FREE_P.z), win(t, 49.6, 52));
  lab(clientGain, V(CLIENT_P.x, 4.0, CLIENT_P.z), win(t, 49.6, 52));
}

// ---------- loop, controls, recording ----------
let t = 0, playing = true, last = performance.now(), rec = null;
const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), msg = document.getElementById('msg');
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing) { t += dt; if (t >= END) { if (rec) { t = END; stopRec(); } else t = 0; } }
  draw();
  scrub.value = String(Math.round((t / END) * 1000)); timeEl.textContent = t.toFixed(1) + ' s';
  requestAnimationFrame(frame);
}
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; };
document.getElementById('restart').onclick = () => { t = 0; playing = true; playBtn.textContent = 'Pause'; };
scrub.oninput = () => { t = (Number(scrub.value) / 1000) * END; };
addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); playBtn.click(); } if (e.code === 'ArrowRight') t = Math.min(END, t + 1); if (e.code === 'ArrowLeft') t = Math.max(0, t - 1); });
function stopRec() { if (rec && rec.state !== 'inactive') rec.stop(); }
document.getElementById('rec').onclick = () => {
  if (rec) return;
  const type = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m));
  const chunks = []; rec = new MediaRecorder(out.captureStream(60), { mimeType: type, videoBitsPerSecond: 16_000_000 });
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = 'settld-simulation.webm'; a.click(); rec = null; msg.textContent = 'Saved settld-simulation.webm'; };
  t = 0; playing = true; playBtn.textContent = 'Pause'; msg.textContent = 'Recording… keep this tab in front until it finishes (' + END + ' s)'; rec.start(200);
};
function draw() { update(t); renderer.render(scene, camera); g2.drawImage(renderer.domElement, 0, 0, W, H); overlay(t); }
window.__sim = { seek: (x) => { t = x; playing = false; draw(); }, play: () => { playing = true; } };
requestAnimationFrame(frame);
})();
</script>
